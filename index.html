<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wanderlust Travel Excursions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Wanderlust Holidays</h1>
        <p>Curated vacation packages across the world's most scenic destinations.</p>
    </header>
    <div class="destinations-grid">
        <div class="card">
            <h3>Swiss Alps Expedition</h3>
            <p>5 Days Alpine Skiing, cable cars, and resort stay.</p>
            <b>$1,299 / person</b>
            <button onclick="book('Swiss Alps')">Reserve Trip</button>
        </div>
        <div class="card">
            <h3>Bali Tropical Retreat</h3>
            <p>7 Days Private Beach Villa, island tour, and scuba diving.</p>
            <b>$899 / person</b>
            <button onclick="book('Bali Retreat')">Reserve Trip</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
